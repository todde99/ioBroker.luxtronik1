name: Test and Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Check JSON syntax and version sync
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const ioPkg = JSON.parse(fs.readFileSync("io-package.json", "utf8"));
            JSON.parse(fs.readFileSync("admin/jsonConfig.json", "utf8"));
            if (pkg.version !== ioPkg.common.version) {
              throw new Error(`Version mismatch: package.json (${pkg.version}) !== io-package.json (${ioPkg.common.version})`);
            }
            console.log("JSON files valid. Version:", pkg.version);
          '

      - name: TypeScript typecheck
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output exists
        run: test -f build/main.js
