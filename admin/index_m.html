<html>
<head>
<!-- these 4 files always have to be included -->
<link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
<link rel="stylesheet" type="text/css" href="../../css/adapter.css"/>

<script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
<script type="text/javascript" src="../../socket.io/socket.io.js"></script>

<!-- these files always have to be included -->
<script type="text/javascript" src="../../js/translate.js"></script>
<script type="text/javascript" src="../../lib/js/materialize.js"></script>
<script type="text/javascript" src="../../js/adapter-settings.js"></script>
<script type="text/javascript" src="words.js"></script>
<style>
    .m .col .select-wrapper+label {
        top: -26px;
    }
    .m span.helper-text {
        font-size: 0.85em;
        color: #757575;
    }
</style>
<script type="text/javascript">
    var DEFAULTS = {
        host: '',
        port: 8888,
        pollInterval: 300000,
        socketTimeout: 15000
    };

    function load(settings, onChange) {
        if (!settings) return;
        $('.value').each(function () {
            var $key = $(this);
            var id = $key.attr('id');
            var val = (settings[id] !== undefined && settings[id] !== null && settings[id] !== '')
                ? settings[id]
                : DEFAULTS[id];

            if ($key.attr('type') === 'checkbox') {
                $key.prop('checked', !!val).on('change', function() {
                    onChange();
                });
            } else {
                $key.val(val).on('change', function() {
                    onChange();
                }).on('keyup', function() {
                    onChange();
                });
            }
        });
        onChange(false);
        if (typeof M !== 'undefined' && M.updateTextFields) {
            M.updateTextFields();
        }
    }

    function save(callback) {
        var obj = {};
        $('.value').each(function () {
            var $this = $(this);
            var id = $this.attr('id');
            var type = $this.attr('type');

            if (type === 'checkbox') {
                obj[id] = $this.prop('checked');
            } else if (type === 'number') {
                var num = parseInt($this.val(), 10);
                obj[id] = isNaN(num) ? (DEFAULTS[id] || 0) : num;
            } else {
                obj[id] = String($this.val() || '').trim();
            }
        });
        callback(obj);
    }
</script>
</head>
<body>
    <div class="m adapter-container">
        <div class="row">
            <div class="row">
                <div class="input-field col s6">
                    <img src="luxtronik1.png" class="logo">
                </div>
            </div>
            <div class="row">
                <div class="input-field col s12 m6 l4">
                    <input class="value" id="host" type="text" placeholder="192.168.178.x"/>
                    <label for="host" class="translate">host</label>
                    <span class="helper-text translate">IP-Adresse des RS232-LAN-Konverters</span>
                </div>
                <div class="input-field col s12 m4 l2">
                    <input class="value" id="port" type="number" min="1" max="65535"/>
                    <label for="port" class="translate">port</label>
                    <span class="helper-text translate">TCP-Port (1 - 65535)</span>
                </div>
            </div>
            <div class="row">
                <div class="input-field col s12 m6 l4">
                    <input class="value" id="pollInterval" type="number" min="10000" step="1000"/>
                    <label for="pollInterval" class="translate">pollInterval</label>
                    <span class="helper-text translate">Abfrageintervall in ms (min. 10000)</span>
                </div>
                <div class="input-field col s12 m6 l4">
                    <input class="value" id="socketTimeout" type="number" min="2000" max="60000" step="500"/>
                    <label for="socketTimeout" class="translate">socketTimeout</label>
                    <span class="helper-text translate">Socket-Timeout in ms (Standard: 15000)</span>
                </div>
            </div>
            <div class="row">
                <div class="col s12">
                    <p class="translate">on save adapter restarts with new config immediately</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
